# ============================================================================
# 千夜扩展配置示例
#
# 放置位置(按优先级):
#   1. $QIANYE_CONFIG 指定的路径
#   2. ./qianye.yaml
#   3. ./data/qianye.yaml
#
# Docker 下容器 WORKDIR=/data 且 compose 把宿主 ./data 挂到 /data,
# 因此容器内的 ./qianye.yaml 就是宿主机的 ./data/qianye.yaml。
#
# 本文件含数据库密码与密钥。/data/ 已在 .gitignore 中,不会被误提交。
# 建议把文件权限设为 0600(启动时若检测到其他用户可读会告警)。
#
# 配置文件不存在 = 整个扩展静默禁用,主程序行为与上游完全一致。
#
# 注意:配置采用严格解析,写错的字段名会导致启动失败而不是被忽略 ——
# 风控开关拼错却静默不生效,是最危险的失败模式。
#
# 数值项的 0 与"不写这个键"含义不同:0 是一个会生效的取值,只有【删掉整行】
# 才会拿到下面注释里写的默认值。0 具体表示什么由字段自己决定,分三类:
#
#   * 限额、冷却、保留期这类闸门:0 = 不设这道限制(逐个字段在下面注明);
#   * 周期、超时、批量这类节奏参数:0 会被消费方回落成内置值,写了等于没写;
#   * 少数核心参数:0 非法,启动时报错退出,错误信息会点名字段。全集如下
#     (带 † 的只在该功能段 enabled: true 时才校验):
#       database.max_idle_conns / max_open_conns
#       runtime.lease_ttl_seconds / hot_hook_queue_size / hot_hook_workers
#       two_phase.pending_grace_seconds / max_probe_attempts / manual_review_after_seconds
#       commission.levels / min_settle_quota
#       withdraw.remark_max_runes / proof_max_bytes †
#       availability.bucket_seconds / flush_interval_seconds †
#       group_pricing 段的全部 5 个数值项 †
#     这份清单由 config 包的 zeroExemptions 逐条断言,多一条少一条测试都会红。
#
# 升级提示:旧版本把所有数值项的 0 当成"没填"静默补默认值。若你的配置里
# 显式写着上面第三类中的某个 0,升级后进程会起不来 —— 删掉那一行即可。
# ============================================================================

enabled: true

# ---------------------------------------------------------------------------
# 独立 MySQL。仅支持 MySQL 5.7.8+ / 8.x
#
# 所有表都带 qy_ 前缀,因此可以安全地与主库指向同一个 schema ——
# 小规模部署不必真的开第二个库,大规模部署仍然完全独立。
# ---------------------------------------------------------------------------
database:
  dsn: "qy_user:CHANGE_ME@tcp(127.0.0.1:3306)/qianye?charset=utf8mb4&parseTime=true&loc=Local"
  max_idle_conns: 20
  max_open_conns: 100
  conn_max_lifetime_seconds: 600
  conn_max_idle_time_seconds: 120
  connect_timeout_seconds: 5
  # 驱动层的硬上界,会被写进 DSN(运维在 dsn 里显式写过就以 dsn 为准)。
  # 这是连接级的兜底闸门:没有它时,一条撞上行锁的语句会一直等到 MySQL 的
  # innodb_lock_wait_timeout(默认 50 秒),把连接池逐个占死。
  # 必须大于最慢的一次合法后台操作(结算事务、批量清理),否则正常业务会被
  # 驱动层随机切断。热路径的 200ms 精确上界由 hot_path_timeout_ms 的 ctx 负责。
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  slow_threshold_ms: 200
  log_level: warn          # silent | error | warn | info
  auto_migrate: true       # 仅主节点(NODE_TYPE != slave)实际执行,且有跨节点互斥锁

# ---------------------------------------------------------------------------
# 运行时与降级策略
# ---------------------------------------------------------------------------
runtime:
  # 扩展库故障时,relay 热路径一律放行。
  # 不要改成 false —— 那会让扩展变成主业务的单点故障。
  hot_path_fail_open: true
  hot_path_timeout_ms: 200
  cold_path_timeout_ms: 3000
  health_interval_seconds: 15
  breaker_failure_threshold: 5
  breaker_open_seconds: 30
  background_enabled: true
  lease_ttl_seconds: 60
  lease_renew_seconds: 20        # 必须小于 lease_ttl_seconds 的一半
  config_reload_seconds: 0       # 0 = 关闭热载;大于 0 时轮询文件修改时间(database 段永不热载)
  hot_hook_queue_size: 4096
  hot_hook_workers: 2

# ---------------------------------------------------------------------------
# 跨库两阶段(划转 / 佣金兑现 / 提现到账 共用)
# ---------------------------------------------------------------------------
two_phase:
  # 在主库建一张 qy_fund_outbox 探针表,与资金变更写在同一个事务里。
  # 这是判定"主库到底动没动钱"的唯一精确手段。关掉它意味着放弃自动对账,
  # 所有中间态都只能转人工。强烈建议保持 true。
  main_outbox_enabled: true
  compensate_interval_seconds: 30
  pending_grace_seconds: 60
  max_probe_attempts: 10
  batch_size: 200
  manual_review_after_seconds: 900   # 超过此时长仍无法判定则转人工并告警
  outbox_retention_days: 30

audit:
  enabled: true
  record_ip: true
  snapshot_max_bytes: 4096
  # HTTP 请求台账(qy_request_audits)。消费方:qianye/service/audit/middleware.go,
  # 挂在 /api/qy 根组上,自动记录全部写请求(POST/PUT/PATCH/DELETE)与少数
  # 会泄露明文的 GET(收款信息解密、打款凭证原图)。
  #
  # 它与 qy_audit_logs 的分工:后者记「判定」(按什么费率、前后快照、冻结汇率),
  # 靠调用点手写埋点,漏一处就是永久盲区;前者记「调用」(谁、何时、成没成功),
  # 由中间件兜底,新接口天然有痕。请求体与 query 均按键名脱敏后入库,
  # 支付密码/收款账号这类整体由凭证构成的路由 body 完全不入库。
  #
  # 关掉它只会让写请求失去 HTTP 留痕,不影响资金审计。
  request_enabled: true
  # qy_audit_logs 的保留天数。消费方:qianye/service/audit/retention.go 的 Prune,
  # 由 lease.Run("audit.prune", ...) 每 6 小时调度一次(走租约,多节点不会双跑)。
  #
  #   0(默认)= 永久保留,一行都不删。这是资金审计应有的默认:qy_audit_logs 是
  #             划转/佣金/提现/违规扣费事后仲裁的唯一凭据,删掉就再也无法回答
  #             "这笔钱当时为什么这么算、谁批的"。
  #   > 0     = 删除 created_at 早于 N 天的行,按主键开窗分批删(每窗 500 行、
  #             窗间让路 50ms、单轮上限 10 万行),不会一条 DELETE 锁住整张表。
  #
  # 硬下限 365 天:小于它(且不为 0)会**直接拒绝启动**,不做静默夹取 ——
  # 夹取会让你以为配的是 7 天而实际跑的是 365 天。下限的依据是两条外部时限里
  # 更长的那条:拒付(chargeback)争议窗口普遍到 180 天且仲裁还会往后拖,
  # 而税务与审计留存按年计,一个完整会计年度是最小可用粒度。
  retention_days: 0

# ===========================================================================
# 以下为各业务功能。当前仅地基(P0)已实现,功能模块尚在开发中,
# 因此默认全部关闭。对应阶段落地后再逐个打开。
# ===========================================================================

# ---------------------------------------------------------------------------
# 用户间余额划转(P2)
# ---------------------------------------------------------------------------
transfer:
  enabled: false
  min_quota: 500000                  # 500000 quota = $1
  max_per_tx_quota: 50000000         # $100
  daily_max_quota: 200000000
  daily_max_count: 20
  fee_bps: 0                         # 万分比,5% 写 500
  fee_min_quota: 0
  cooldown_seconds: 10
  # 收款人查找方式。刻意不提供用户名模糊搜索:那等于开放用户枚举,
  # 也与"已邀请用户列表要脱敏"的隐私要求自相矛盾。
  recipient_lookup: "id"             # id | id_or_email
  new_account_freeze_hours: 24       # 新注册账号多久内不可转出(防套现洗号)
  require_receiver_enabled: true
  receiver_daily_max_in_count: 50    # 单账号每日最多接收多少笔(防大量小号向一个账号集中打款)
  lookup_log_retain_days: 30         # 收款人查找日志保留天数(用于发现批量探测用户ID的行为)

# ---------------------------------------------------------------------------
# 邀请返佣(P4)
#
# 口径默认宽松(全返)。三个排除开关默认关闭,上线后若发现套利再逐个打开,
# 不需要改代码。
# ---------------------------------------------------------------------------
commission:
  enabled: false
  # 返佣比例直接写百分比,支持两位小数:10 / 10.5 / 10.25。
  # 内部会换算成整数(百分比 × 100)参与运算,不经过浮点。
  #
  # 这两项是**全局默认值**。想给不同分组不同比例,在管理端
  #「佣金配置 → 分组费率」里加规则;未配规则的分组回落到这里。
  topup_rate_percent: "10"           # 充值返佣 10%
  consume_rate_percent: "5"          # 消费返佣 5%
  # 旧字段 topup_rate_bps / consume_rate_bps(万分比)仍可解析,但已废弃:
  # 启动时会打告警并换算进上面两项,与上面两项矛盾时直接启动失败。请尽快改名。
  levels: 1                          # 当前仅支持一级邀请
  # 佣金按 decimal 全精度累计,累到该值才结算成整数额度。
  # 没有这个机制的话,单次几十额度的消费按 5% 算会被整数截断成 0,
  # 用户会觉得"用了一天一分佣金没有"。
  min_settle_quota: 1000
  max_per_order_quota: 50000000
  # 佣金成熟期,防"充值拿佣金→提现→退款"套利。从消费所在自然日结束起算。
  # 0 是合法策略:当天结束即可结算,不设延迟。删掉这一行才取默认的 7 天。
  holding_days: 7
  settle_interval_seconds: 300
  inviter_cache_seconds: 300         # 邀请关系缓存,避免给主库加上与 relay 等量的读压力
  topup_scan_interval_seconds: 60
  topup_scan_lookback_hours: 72      # top_ups 表没有 updated_at,只能低水位 + 回扫窗口去重

  # ↓ 三个风控开关。默认宽松,打开即收紧。
  exclude_redemption_and_manual: false  # true = 兑换码充值与管理员补单不返佣
                                        # (关闭时管理员给小号送额度也会产生佣金,可被套利)
  exclude_subscription_consume: false   # true = 订阅额度消费不返佣
                                        # (关闭时用户用订阅套餐消费也返佣,平台重复出血)
  refund_clawback: false                # true = 退款时冲正已发放的佣金
                                        # (关闭时"充值→拿佣金→退款"可循环套利)
  # 无开关的硬排除:违规扣费产生的消费日志永不返佣 ——
  # 用户被罚款而邀请人赚钱属于逻辑错误,不是口径偏好。

# ---------------------------------------------------------------------------
# 佣金提现(P5)。两种方式并存,用户自选。
#
# ███ 开启 "fiat" 之前必读 ███████████████████████████████████████████████████
#
# 【withdraw.enabled: true】且【methods 含 "fiat"】时,下面两项变成必填:
#
#     pii_key      base64 编码,解码后必须正好 32 字节(AES-256)
#     digest_key   另一串独立随机值,不得与 pii_key 相同
#
# 缺任何一个,config.Load() 会返回错误 → main.go FatalLog → **整个站点起不来**。
# 这不是"法币提现不可用"这么轻,是进程直接退出。
#
# 两个条件缺一不可,这一点很容易踩:本示例出厂就是 methods 含 "fiat" 且两把钥匙
# 都为空,而它能正常加载 —— 因为 withdraw.enabled 还是 false
# (validateWithdraw 的第一行就是 `if !w.Enabled { return nil }`)。
# 换句话说,把 enabled 翻成 true 的【那一次重启】才会炸,而不是改 methods 的那一次。
# 请把"生成两把钥匙"和"enabled: true"当作同一次改动一起做完。
#
# 正确做法(两条命令,两串不同的值):
#     openssl rand -base64 32     # 填 pii_key
#     openssl rand -base64 32     # 再跑一次,填 digest_key
#
# 两把钥匙必须分开:pii_key 可以轮换(见下方 pii_keys_retired),
# digest_key 永不轮换。合成一把之后,轮换那天全部历史风控指纹一起作废,
# 而"同一个收款账号被 N 个小号使用"正是提现场景最有价值的信号。
#
# 密钥只能留在本文件(YAML),不进管理端在线配置:能在线改的前置条件
# 等于运营点一下就能让站点下次重启起不来。同理,methods 本身也不放进
# qy_settings —— 它的前置条件是密钥。
# █████████████████████████████████████████████████████████████████████████████
# ---------------------------------------------------------------------------
withdraw:
  enabled: false
  # quota = 佣金兑换为平台余额,审核通过自动到账(这就是用户看到的「余额」)
  # fiat  = 线下法币打款,人工审核 + 人工打款(这就是用户看到的「提现」)
  #
  # 只写 ["quota"] 时前端的方式单选组只有一个选项,看起来像"不能选" ——
  # 那不是缺陷,是这里没开。要让用户能选,先读上面那段再改。
  methods: ["quota", "fiat"]
  min_quota: 500000
  min_fiat_amount: "100"
  fiat_currency: "CNY"
  fiat_fee_bps: 0
  # 佣金产生时冻结当时汇率。USDExchangeRate 是管理员可随时修改的全局变量,
  # 不冻结的话历史对账永远对不上。
  rate_freeze_mode: "operation_setting"   # operation_setting | fixed
  rate_freeze_fixed: "7.3"
  # quota 方式审核通过后是否立即自动兑现成平台余额。
  #
  # true (默认):管理员点"通过"即触发跨库兑现;进程崩在中途时对账任务会重新拾起。
  # false:审核与兑现拆成两步,approved 的 quota 单不会自动到账,必须由管理员在
  #        管理端对该单点"立即兑现"(POST /api/qy/admin/withdraw/:id/credit)才会
  #        真正加额度。这条路径与自动兑现共用同一道 approved → paying CAS 闸门,
  #        重复点击不会重复加钱;此时对账任务也不再自动重试 approved 单。
  #
  # 注意:填 false 之后**绝不能**改用"标记已打款"来了结 quota 单 —— 那条路只核销
  # 佣金、不加额度,而且 paid 是不可逆终态。后端已强制拒绝(qy_wd_not_fiat_order)。
  auto_credit_on_approve: true
  daily_max_count: 3
  cooldown_seconds: 60               # 两次申请之间的最小间隔
  max_pending_orders: 3              # 同时存在的未终态单上限,防审核队列被小额单淹没
  max_quota_per_order: 500000000     # 单笔提现上限
  daily_max_quota: 1000000000        # 单日提现总额上限
  # 收款信息保留天数,到期清除密文只留脱敏串(脱敏串与风控指纹永久保留)。
  # 删掉这一行等于 180;要彻底关掉清理请显式填 0 —— 那意味着一批银行卡号密文
  # 永久留在库里,请确认这是合规上想要的结果。
  pii_retention_days: 180
  payee_account_max: 3
  review_sla_hours: 72
  remark_max_runes: 200              # 用户自定义说明的字数上限(按字符计,中文算一个)
  # ⚠ 收款信息属个人敏感信息,必须加密存储。
  # ⚠ enabled: true 且 methods 含 "fiat" 时,pii_key 与 digest_key 两项都必填 ——
  # ⚠ 留空会让 config.Load() 失败,主程序 FatalLog,**站点起不来**。
  # ⚠ 两串都用 `openssl rand -base64 32` 生成,且必须互不相同。
  pii_key: ""                        # base64 编码的 32 字节 AES-256 密钥
  pii_key_version: 1                 # 写进每一行密文,解密时按它选密钥
  # 轮换密钥的唯一正确做法:把旧的 pii_key 连同它的版本号搬到这里,再填新的
  # pii_key 与更大的 pii_key_version。直接换掉 pii_key 而不登记旧钥,队列里
  # 全部待打款单的收款账号会同时变成不可解密 —— 钱打不出去,佣金还锁在 frozen 里。
  # 旧钥要留到对应密文被 pii_retention_days 清干净为止。
  pii_keys_retired: {}
  #   1: "<上一代 base64 32 字节密钥>"
  # 风控指纹用的独立密钥。必须与 pii_key 分开且不轮换,
  # 否则密钥轮换后历史指纹全部失效,跨账户风控索引作废。
  # 填与 pii_key 相同的值会被校验器直接拒绝启动。
  digest_key: ""
  # ── 提现凭证图片(可选,仅 fiat 路径)────────────────────────────────────
  #
  # 用户可以给一笔法币提现附一张图(收款码 / 打款截图 / 身份材料)。
  #
  # 存放位置:**本地磁盘**,与本配置文件同级的 qy-withdraw-proofs/ 目录
  # (Docker 下即宿主机 ./data/qy-withdraw-proofs/,整个 /data/ 已在 .gitignore)。
  # 不入数据库:一张 2 MiB 的截图进 MySQL 会让每一次备份、每一次主从复制都拖着它走。
  #
  # ⚠ 已知限制:**多节点部署时本地磁盘各存各的** —— A 节点收到的上传,
  #   B 节点下载不到(用户会看到"凭证已清理")。单节点部署无碍;多节点请把
  #   qy-withdraw-proofs/ 放到共享存储(NFS/EFS)上,或等后续接对象存储。
  #
  # ⚠ 该目录**不在任何静态资源路由的可达范围内**,这不是靠配置保证的:
  #   本项目的静态资源只有 embed.FS(web/dist)一个来源,磁盘目录天然不可达。
  #   请不要为了"方便预览"给它加一条 router.Static —— 那会让全部凭证公开可读。
  #
  # 图片只能通过带鉴权的接口取:
  #   GET /api/qy/withdraw/:id/proof              仅本人
  #   GET /api/qy/admin/withdraw/:id/proof?reason= 管理员,事由必填 + 写 PII 审计
  #
  # 清理口径(与收款信息密文同一个入口):
  #   传了但 24 小时内没提交申请  → 删
  #   单据被拒绝 / 撤销 / 打款失败 → 删(钱没出去,凭证没有留存价值)
  #   单据已打款                   → 按 pii_retention_days 到期后删
  #
  # 上面这三条都固化在代码里,没有对应的配置项 —— 它们的语义完全依附于单据本身,
  # 单独放出旋钮只会变成"定义了却没人调"的又一个。同理,单个用户同时挂着的
  # 未提交上传最多 3 张(超出回 qy_wd_proof_pending_limit),防的是
  # "只上传、不提交"把磁盘打满:那条路径压根不创建单据,daily_max_count 与
  # max_pending_orders 一个都拦不到。
  #
  # 只接受 JPEG / PNG / WebP,且按**文件魔数**判定,不看扩展名也不看 Content-Type。
  proof_enabled: true
  # 单张上限,字节。上界 8388608(8 MiB)—— 校验魔数要把整张图读进内存,
  # 填 0 或超过上界都会直接拒绝启动。
  proof_max_bytes: 2097152           # 2 MiB

# ---------------------------------------------------------------------------
# 钱包页入口(P1)
# ---------------------------------------------------------------------------
wallet:
  show_transfer_entry: true
  show_commission_entry: true
  show_withdraw_entry: true

# ---------------------------------------------------------------------------
# 使用日志新增列(P3)
# ---------------------------------------------------------------------------
log_metrics:
  show_reasoning_effort: true
  show_cache_ratio: true
  enable_filter: false               # 开启 SQL 层筛选/排序需要旁路物化表,成本显著上升

# ---------------------------------------------------------------------------
# 无权分组泄漏修复(P1)
# ---------------------------------------------------------------------------
group_visibility:
  enabled: true
  filter_pricing: true               # 模型广场:裁剪每个模型的 enable_groups
  filter_perf_metrics: true          # 运营数据:汇总白名单 + ?group= 归属校验
  include_auto_group: true           # "auto" 分组始终保留
  # 没有 filter_group_api:分组 API 本身已与可用分组白名单求过交集,无泄漏可修

# ---------------------------------------------------------------------------
# 模型可用率监控(P6)
# ---------------------------------------------------------------------------
availability:
  enabled: false
  sample_attempt_level: true
  bucket_seconds: 300                # 必须是 3600 的因数
  flush_interval_seconds: 60
  retention_days: 30
  max_series_per_query: 200
  count_client_errors: false         # 4xx 用户错误是否计入不可用(默认不计)
  count_rate_limited: false          # 限流是否计入不可用(默认不计)

# ---------------------------------------------------------------------------
# 违规检测(P7)
# ---------------------------------------------------------------------------
violation:
  enabled: false
  # 没有全局 shadow_mode:影子/真实是每条规则自己的属性(qy_violation_rule.mode),
  # 新建与内置规则包导入一律落影子,改模式就是在管理端改那一条规则。
  # ⚠️ 下面两个开关默认为 false。只写 enabled: true 而不打开它们,
  # 两个检测挂载点都是空转 —— 这是安全的默认,但别误以为"开了却不生效"。
  precheck_enabled: false            # 转发前检查提示词并拒绝
  post_charge_enabled: true          # 事后按模型价格倍数扣费
  fee_multiplier: "1.0"              # 扣费倍数,乘以本次请求的计费额
  fixed_fee_amount: "0.05"           # 拿不到模型价格时的固定扣费(美元)
  max_fee_quota: 5000000             # 单次违规扣费硬上限($10)
  # 上游的额度扣减没有余额校验,不指定策略会把用户余额扣成负数。
  insufficient_balance_policy: "clamp"   # clamp(扣到 0 为止) | negative | ban
  auto_ban_threshold: 0              # 0 = 不自动封号
  auto_ban_window_hours: 24
  # 熔断:拦截率或封号速率异常时自动回落影子模式,防止规则写错造成全站事故。
  global_block_rate_limit_bps: 500   # 拦截率超过 5% 即熔断
  global_ban_rate_limit_per_hour: 20
  evidence_max_bytes: 8192           # 违规上下文的留存上限(超出截断)
  evidence_retention_days: 90
  rule_cache_seconds: 60
  scan_timeout_ms: 20

# ---------------------------------------------------------------------------
# 模型按分组单独定价(P8)
# ---------------------------------------------------------------------------
# 语义:最终扣费 = 分组级模型价 × 分组倍率(相乘,不是覆盖)。
# 没有配置分组级价格的模型完全走原路径(全局价 × 分组倍率),升级不改变任何
# 既有计费结果。规则本身在管理端维护(存扩展库),这里只有运行参数。
group_pricing:
  enabled: false
  # 影子模式:完整算出「若启用分组价会扣多少」并记录差额,但实际仍按旧价扣费。
  # 这是本功能唯一的安全阀 —— 计费改错不可逆,钱扣走了退不精确。
  # 必须先在影子模式下用 /api/qy/admin/group-pricing/shadow/summary 对账,
  # 确认「这个月会多收/少收多少」符合预期,再改成 false。
  shadow_mode: true
  rule_cache_seconds: 60             # 规则内存快照的刷新周期(规则读取在 relay 热路径上)
  # 快照陈旧上限。超过它仍未刷新成功,查找一律回落成「无覆盖」走全局价 ——
  # 少一个折扣是运营问题,按一份来历不明的旧规则扣钱是资损问题。
  # 必须 >= rule_cache_seconds,否则快照每轮刷新前都先过期,分组价会来回抖动。
  max_stale_seconds: 300
  shadow_flush_interval_seconds: 60  # 影子差额从内存落库的周期
  shadow_retention_days: 90
  max_rules: 2000                    # 规则总数上限(规则表每个刷新周期被全量拉取)
